name: Atualiza os cards do perfil

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["perfil.json", "scripts/**", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.68.0
      - name: Lê o calendário de contribuições
        run: python scripts/fetch_contributions.py
      - name: Desenha os cards e o README
        run: python scripts/render_readme_cards.py
      - name: Grava se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards data
          git diff --cached --quiet || (git commit -m "Atualiza os cards do perfil" && git push)
