<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="Sustento: Oracle, PL/SQL, Forms e Reports em produção"><title>Sustento: Oracle, PL/SQL, Forms e Reports em produção</title><style>@font-face{font-family:AKd;font-weight:800;src:url(data:font/woff;base64,) format('woff')}.fd{font-family:AKd,'Helvetica Neue',Arial,sans-serif;font-weight:800}@font-face{font-family:AKt;font-weight:400;src:url(data:font/woff;base64,) format('woff')}.ft{font-family:AKt,'Helvetica Neue',Arial,sans-serif;font-weight:400}@font-face{font-family:AKm;font-weight:400;src:url(data:font/woff;base64,) format('woff')}.fm{font-family:AKm,ui-monospace,Menlo,Consolas,monospace;font-weight:400}
