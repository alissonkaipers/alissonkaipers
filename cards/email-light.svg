<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110" role="img" aria-label="E-mail"><title>E-mail</title><style>@font-face{font-family:AKb;font-weight:600;src:url(data:font/woff;base64,) format('woff')}.fb{font-family:AKb,'Helvetica Neue',Arial,sans-serif;font-weight:600}
.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:left;animation:wipe .9s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes wipe{from{transform:scaleX(0)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes nudge{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".75" y=".75" width="598.5" height="108.5" rx="10" fill="#f7f9fc" stroke="#c9d3e3" stroke-width="1.5"/><g class="up" style="animation-delay:0ms"><text class="fb" x="40.0" y="67.0" font-size="32.0" fill="#0f1b2d">E-mail</text></g><g class="nudge" style="animation-delay:0ms"><text class="fb" x="552.0" y="67.0" font-size="32.0" fill="#1a56db" text-anchor="end">→</text></g></svg>
