<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Formação: MBA em Ciência de Dados e Inteligência Artificial, UNINTER, 2026–2027 (em curso); Especialização em Engenharia de Software em IA Aplicada, UNIPDS, 2026–2027 (em curso); Especialização em Gestão da Tecnologia da Informação, UNINTER, 2026–2027 (em curso); Bacharelado em Engenharia de Software, UNINTER, 2021–2026 (concluído)"><title>Formação: MBA em Ciência de Dados e Inteligência Artificial, UNINTER, 2026–2027 (em curso); Especialização em Engenharia de Software em IA Aplicada, UNIPDS, 2026–2027 (em curso); Especialização em Gestão da Tecnologia da Informação, UNINTER, 2026–2027 (em curso); Bacharelado em Engenharia de Software, UNINTER, 2021–2026 (concluído)</title><style>@font-face{font-family:AKd;font-weight:800;src:url(data:font/woff;base64,) format('woff')}.fd{font-family:AKd,'Helvetica Neue',Arial,sans-serif;font-weight:800}@font-face{font-family:AKb;font-weight:600;src:url(data:font/woff;base64,) format('woff')}.fb{font-family:AKb,'Helvetica Neue',Arial,sans-serif;font-weight:600}@font-face{font-family:AKm;font-weight:400;src:url(data:font/woff;base64,) format('woff')}.fm{font-family:AKm,ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:left;animation:wipe .9s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes wipe{from{transform:scaleX(0)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes nudge{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
